name: slop-valley
services:
  web:
    image: slop-valley:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
